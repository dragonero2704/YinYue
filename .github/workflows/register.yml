name: "Register commands"

on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths:
            - "./commands/**"

jobs:
    register:
        runs-on: "ubuntu-latest"
        steps:
            - name: "Checkout"
              uses: actions/checkout@v4
            - name: "Check node version"
              run: "node --version"

    